<!DOCTYPE html>

<base target="_top">

<style>

body{
margin:0;
padding:20px;
font-family:Arial,sans-serif;
background:#f2f6fb;
text-align:center;
}

.header{
background:#1976d2;
color:white;
padding:20px;
border-radius:15px;
box-shadow:0 4px 12px rgba(0,0,0,.2);
}

.logo-wrap{
position:relative;
width:120px;
height:120px;
margin:0 auto;
overflow:hidden;
border-radius:50%;
clip-path:circle(50%);
display:flex;
align-items:center;
justify-content:center;
}

.logo-wrap img{
height:100%;
width:auto;
display:block;
animation:logoGlow 6s ease-in-out infinite;
}

.logo-wrap::after{
content:"";
position:absolute;
inset:0;
clip-path:circle(50%);
background:linear-gradient(115deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.95) 48%, rgba(255,255,255,0) 66%);
background-size:300% 300%;
background-position:200% 0%;
-webkit-mask-image:url('https://drive.google.com/thumbnail?id=1Rk1xVXKI1zIwN_Q70j_0PimtuXDH74rd&sz=w300');
-webkit-mask-size:contain;
-webkit-mask-repeat:no-repeat;
-webkit-mask-position:center;
mask-image:url('https://drive.google.com/thumbnail?id=1Rk1xVXKI1zIwN_Q70j_0PimtuXDH74rd&sz=w300');
mask-size:contain;
mask-repeat:no-repeat;
mask-position:center;
animation:shineSweep 6s ease-in-out infinite;
pointer-events:none;
}

@keyframes shineSweep{
0%{ background-position:200% 0%; }
50%{ background-position:-100% 0%; }
100%{ background-position:-100% 0%; }
}

@keyframes logoGlow{
0%{ filter:brightness(1) drop-shadow(0 0 0 rgba(255,255,255,0)); }
50%{ filter:brightness(1) drop-shadow(0 0 0 rgba(255,255,255,0)); }
56%{ filter:brightness(1.7) drop-shadow(0 0 18px rgba(255,255,255,0.9)); }
62%{ filter:brightness(1) drop-shadow(0 0 0 rgba(255,255,255,0)); }
100%{ filter:brightness(1) drop-shadow(0 0 0 rgba(255,255,255,0)); }
}

.title{
color:#ffffff;
font-weight:700;
font-size:24px;
margin-top:12px;
letter-spacing:0.3px;
-webkit-text-stroke:0.6px #000;
text-shadow:-1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
}

.container{
max-width:600px;
margin:20px auto;

.store-button:hover{

}
